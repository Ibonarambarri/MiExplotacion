      <circle cx="196" cy="262" r="58"/>
      <circle cx="244" cy="206" r="62"/>
      <circle cx="312" cy="200" r="60"/>
      <circle cx="366" cy="248" r="56"/>
      <circle cx="350" cy="306" r="52"/>
      <circle cx="286" cy="322" r="54"/>
      <circle cx="222" cy="316" r="50"/>
